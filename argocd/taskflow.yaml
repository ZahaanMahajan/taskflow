apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: taskflow
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:zahaanmahajan/taskflow.git
    targetRevision: main
    path: k8s

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: taskflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
