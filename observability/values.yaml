fullnameOverride: monitoring

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: "null"
      group_by:
        - alertname
        - namespace
        - service
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: discord
          matchers:
            - service="taskflow"
            - severity=~"critical|warning"

    receivers:
      - name: "null"

      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/webhook-url
            send_resolved: true

  alertmanagerSpec:
    secrets:
      - alertmanager-discord-webhook

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: username
    passwordKey: password
  ingress:
    enabled: false
  service:
    type: ClusterIP
  persistence:
    enabled: true
    type: sts
    storageClassName: gp3
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

prometheus:
  enabled: true
  service:
    type: ClusterIP
  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 4GB
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 750m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
