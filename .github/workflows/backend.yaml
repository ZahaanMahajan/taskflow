name: Backend

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "backend/**"

permissions:
  contents: write
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test
        working-directory: backend
        run: ./mvnw clean test

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        working-directory: backend
        run: |
          docker build \
            -t ghcr.io/zahaanmahajan/taskflow-backend:${{ github.sha }} \
            .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/zahaanmahajan/taskflow-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image
        run: |
          docker push \
            ghcr.io/zahaanmahajan/taskflow-backend:${{ github.sha }}
      
      - name: Update Kubernetes image
        run: |
          sed -i \
            "s|image: ghcr.io/zahaanmahajan/taskflow-backend:.*|image: ghcr.io/zahaanmahajan/taskflow-backend:${{ github.sha }}|" \
            k8s/applications/taskflow/backend/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/applications/taskflow/backend/deployment.yaml

          if git diff --cached --quiet; then
            echo "No image change detected."
            exit 0
          fi

          git commit -m "chore: update backend image to ${{ github.sha }}"
          git push
