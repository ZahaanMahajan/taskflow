name: Backend

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "backend/**"

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test
        working-directory: backend
        run: ./mvnw clean test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        working-directory: backend
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/taskflow-backend:${{ github.sha }} \
            .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/taskflow-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/taskflow-backend:${{ github.sha }}
