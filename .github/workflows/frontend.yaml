name: Frontend

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "frontend/**"

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test build
        working-directory: frontend
        run: npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        working-directory: frontend
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/taskflow-frontend:${{ github.sha }} \
            .

      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/taskflow-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/taskflow-frontend:${{ github.sha }}
