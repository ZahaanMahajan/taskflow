name: Frontend

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "frontend/**"

permissions:
  contents: write
  packages: write

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test build
        working-directory: frontend
        run: npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        working-directory: frontend
        run: |
          docker build \
            -t ghcr.io/zahaanmahajan/taskflow-frontend:${{ github.sha }} \
            .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/zahaanmahajan/taskflow-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image
        run: |
          docker push \
            ghcr.io/zahaanmahajan/taskflow-frontend:${{ github.sha }}

      - name: Update Kubernetes image
        run: |
          sed -i \
            "s|image: ghcr.io/zahaanmahajan/taskflow-frontend:.*|image: ghcr.io/zahaanmahajan/taskflow-frontend:${{ github.sha }}|" \
            k8s/applications/taskflow/frontend/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/applications/taskflow/frontend/deployment.yaml

          if git diff --cached --quiet; then
            echo "No image change detected."
            exit 0
          fi

          git commit -m "chore: update frontend image to ${{ github.sha }}"
          git push
