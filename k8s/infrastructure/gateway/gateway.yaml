apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: taskflow-gateway
  namespace: taskflow

spec:
  gatewayClassName: aws-alb

  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: taskflow-alb

  listeners:
    - name: https
      hostname: "*.aws.zahaan.online"
      protocol: HTTPS
      port: 443

      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: taskflow
