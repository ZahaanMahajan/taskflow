apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: taskflow-frontend
  namespace: taskflow

spec:
  parentRefs:
    - name: taskflow-gateway

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: taskflow-frontend
          port: 80
