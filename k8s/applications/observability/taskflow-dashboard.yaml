apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-production-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  taskflow-production.json: |-
    {
      "uid": "taskflow-production",
      "title": "TaskFlow Production",
      "tags": ["taskflow", "production"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Backend Availability",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "min(up{job=\"taskflow-backend\"})",
              "legendFormat": "Available",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {"text": "DOWN"},
                    "1": {"text": "UP"}
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center"
          }
        },
        {
          "id": 2,
          "title": "HTTP Requests / Second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 8, "w": 18, "x": 6, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (uri, method) (rate(http_server_requests_seconds_count{job=\"taskflow-backend\",uri!~\"/actuator.*\"}[5m]))",
              "legendFormat": "{{method}} {{uri}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          }
        },
        {
          "id": 3,
          "title": "HTTP 5xx Errors / Second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"taskflow-backend\",status=~\"5..\",uri!~\"/actuator.*\"}[5m]))",
              "legendFormat": "5xx errors"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "reqps", "min": 0},
            "overrides": []
          },
          "options": {
            "legend": {"showLegend": false},
            "tooltip": {"mode": "single"}
          }
        },
        {
          "id": 4,
          "title": "Average HTTP Request Latency",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (uri) (rate(http_server_requests_seconds_sum{job=\"taskflow-backend\",uri!~\"/actuator.*\"}[5m])) / clamp_min(sum by (uri) (rate(http_server_requests_seconds_count{job=\"taskflow-backend\",uri!~\"/actuator.*\"}[5m])), 1e-9)",
              "legendFormat": "{{uri}}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "s", "min": 0},
            "overrides": []
          },
          "options": {
            "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          }
        },
        {
          "id": 5,
          "title": "JVM Heap Used by Replica",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (jvm_memory_used_bytes{job=\"taskflow-backend\",area=\"heap\"})",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "bytes", "min": 0},
            "overrides": []
          },
          "options": {
            "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          }
        },
        {
          "id": 6,
          "title": "Process CPU Usage by Replica",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [
            {
              "refId": "A",
              "expr": "process_cpu_usage{job=\"taskflow-backend\"}",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          }
        }
      ]
    }
