apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
  namespace: taskflow
spec:
  replicas: 2

  selector:
    matchLabels:
      app: taskflow-backend

  template:
    metadata:
      labels:
        app: taskflow-backend

    spec:
      imagePullSecrets:
        - name: taskflow-ghcr-pull-secret

      containers:
        - name: backend
          image: ghcr.io/zahaanmahajan/taskflow-backend:eeda8ae3ff42828d0dad665ccfddf8dd969f1207

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod

            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: taskflow-db
                  key: DB_URL

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: taskflow-db
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-db
                  key: DB_PASSWORD

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
