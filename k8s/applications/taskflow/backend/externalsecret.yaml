apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: taskflow-db
  namespace: taskflow

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore

  target:
    name: taskflow-db-managed
    creationPolicy: Owner

  data:
    - secretKey: DB_URL
      remoteRef:
        key: taskflow/production/database
        property: DB_URL

    - secretKey: DB_USER
      remoteRef:
        key: taskflow/production/database
        property: DB_USER

    - secretKey: DB_PASSWORD
      remoteRef:
        key: taskflow/production/database
        property: DB_PASSWORD
