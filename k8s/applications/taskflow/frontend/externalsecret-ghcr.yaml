apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: taskflow-ghcr
  namespace: taskflow

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore

  target:
    name: taskflow-ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson

  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: taskflow/production/ghcr
        property: dockerconfigjson
