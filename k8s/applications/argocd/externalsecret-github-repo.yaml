apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: taskflow-github-repo
  namespace: argocd

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: taskflow-github-repo
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      type: Opaque

  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: taskflow/production/argocd-github
        property: sshPrivateKey

    - secretKey: type
      remoteRef:
        key: taskflow/production/argocd-github
        property: type

    - secretKey: url
      remoteRef:
        key: taskflow/production/argocd-github
        property: url
